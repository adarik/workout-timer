*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;background:#0b0b0e;color:#fff;overflow:hidden;font-family:InterSub,Inter,Roboto,'Noto Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
/* MENU */
#menu{position:absolute;inset:0;padding:4vh 3vw;display:flex;flex-direction:column;gap:3vh}
#menu h1{font-size:7vh;font-weight:900;letter-spacing:.05em}
#menu .hint{font-size:3.4vh;color:#b9b9c4;font-weight:600}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2.4vh 1.6vw;min-height:0}
.mcard{min-width:0;background:#15151b;border:2px solid #2a2a33;border-top:1vh solid var(--acc);border-radius:2.4vh;padding:2.4vh 1.8vw;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1vh;text-align:left}
.mcard:active{background:#1e1e26}
.mcard .ic{width:10vh;height:10vh;flex:none;background:#1d1d24;border-radius:2vh}
.mcard .ic svg{width:100%;height:100%}
.mcard .t{font-size:3.8vh;font-weight:900;line-height:1.05;color:#fff}
.mcard .m{font-size:3.2vh;font-weight:800;color:var(--acc);margin-top:1vh}
.mcard .b{font-size:2.8vh;font-weight:600;color:#aeaeb8;margin-top:.6vh}
/* RUN */
#run{position:absolute;inset:0;display:flex;flex-direction:column;
 background:radial-gradient(120vw 60vh at 15% -10%,color-mix(in srgb,var(--acc) 18%,#0b0b0e) 0%,#0b0b0e 70%)}
.top{flex:none;height:9vh;display:flex;align-items:center;gap:2vw;padding:0 2vw;border-bottom:.5vh solid var(--acc)}
.top .wt{font-size:4.6vh;font-weight:900;letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:3.4vh;font-weight:700;color:#d6d6de;white-space:nowrap}
.top .meta b{color:var(--acc);font-weight:900}
.ibtn{width:6.4vh;height:6.4vh;border-radius:1.6vh;background:#1d1d24;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn svg{width:60%;height:60%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.main{flex:1;min-height:0;display:flex;gap:2vw;padding:2vh 2vw 1vh}
.left{flex:none;width:33vw;background:#15151b;border:2px solid #2a2a33;border-radius:3vh;padding:1.6vh 1.2vw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.8vh;min-height:0;transform-origin:center}
.phase{font-size:3.6vh;font-weight:900;letter-spacing:.1em;color:#0b0b0e;background:var(--acc);padding:.5vh 2vw;border-radius:6vh;white-space:nowrap}
.rest .phase{background:#7aa2ff}
.icon{height:21vh;aspect-ratio:1/1;background:#1d1d24;border-radius:2.4vh;flex:none}
.icon svg{width:100%;height:100%}
.ename{font-size:4.6vh;font-weight:900;line-height:1.05;text-align:center}
.esub{font-size:3vh;font-weight:700;color:#b9b9c4;text-align:center;line-height:1.1}
.clock{font-size:20vh;font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#fff}
.clock.low{color:#ffd23f}
.pbar{width:100%;height:1.6vh;background:#272730;border-radius:1vh;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:0;background:var(--acc)}
.rest .pbar i{background:#7aa2ff}
.tele{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.6vh;padding:1vh 0 0;min-height:0}
.tag{font-size:3.6vh;font-weight:900;letter-spacing:.14em;color:#0b0b0e;background:var(--acc);padding:.5vh 1.4vw;border-radius:1.2vh;align-self:flex-start}
.curwrap{flex:1;min-height:0;border-left:1vh solid var(--acc);padding-left:2vw;display:flex;align-items:center}
.cur{overflow-wrap:anywhere;font-weight:900;line-height:1.08;color:#fff;width:100%}
.nxtbox{flex:none;display:flex;flex-direction:column;gap:1.2vh;padding-bottom:.6vh}
.nxt{display:flex;gap:1.2vw;align-items:baseline;font-weight:800;line-height:1.1}
.nxt .nt{font-size:2.5vh;font-weight:900;letter-spacing:.1em;color:var(--acc);flex:none;min-width:11vw}
.nxt .nx{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.n1{font-size:4.4vh;opacity:.5}
.n2{font-size:3.6vh;opacity:.25}
.in{animation:cin .45s ease-out}
@keyframes cin{from{opacity:0;transform:translateY(3vh)}to{opacity:1;transform:none}}
.bottom{flex:none;height:13vh;display:flex;align-items:center;gap:2vw;padding:0 2vw}
.nextbox{flex:1;min-width:0;display:flex;align-items:center;gap:1.4vw;background:#15151b;border:2px solid #2a2a33;border-radius:2.4vh;height:10.6vh;padding:0 1.4vw}
.nextbox .nl{font-size:3vh;font-weight:900;color:var(--acc);letter-spacing:.1em;flex:none}
.nextbox .ni{height:8vh;aspect-ratio:1/1;background:#1d1d24;border-radius:1.4vh;flex:none}
.nextbox .ni svg{width:100%;height:100%}
.nextbox .nn{font-size:4vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;gap:1.4vw;flex:none}
.cbtn{width:10.6vh;height:10.6vh;border-radius:2.4vh;background:#1d1d24;border:2px solid #2f2f3a;display:flex;align-items:center;justify-content:center}
.cbtn.big{width:14vh;background:var(--acc);border-color:var(--acc)}
.cbtn svg{width:52%;height:52%;fill:#fff;stroke:none}
.cbtn.big svg{fill:#0b0b0e}
.cbtn:active{filter:brightness(1.3)}
.obar{flex:none;height:1.2vh;background:#1d1d24}
.obar i{display:block;height:100%;width:0;background:var(--acc)}
/* overlays */
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,5,8,.72);pointer-events:none;z-index:20}
#count span{font-size:78vh;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 6vh var(--acc),0 0 1.5vh var(--acc);animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(1.5);opacity:0}15%{opacity:1}100%{transform:scale(.88);opacity:.85}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:21;box-shadow:inset 0 0 0 3vh var(--acc),inset 0 0 14vh 6vh var(--acc);opacity:0}
#flash.go{animation:fl 1s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#burst{position:absolute;left:50%;top:50%;width:30vh;height:30vh;margin:-15vh 0 0 -15vh;border-radius:50%;border:2vh solid var(--acc);pointer-events:none;z-index:19;opacity:0}
#burst.go{animation:bu .8s ease-out}
@keyframes bu{0%{transform:scale(.2);opacity:1}100%{transform:scale(9);opacity:0}}
.zoom{animation:zi .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes zi{0%{transform:scale(1.35);opacity:.2;filter:blur(1vh)}100%{transform:scale(1);opacity:1;filter:none}}
#pause{position:absolute;inset:0;z-index:30;background:rgba(5,5,8,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
#pause .pt{font-size:7vh;font-weight:900;letter-spacing:.1em}
#pause .pb{width:24vh;height:24vh;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center}
#pause .pb svg{width:50%;height:50%;fill:#0b0b0e}
#pause .ps{font-size:3.4vh;color:#c9c9d2;font-weight:600}
#list{position:absolute;inset:0;z-index:40;background:rgba(5,5,8,.94);padding:3vh 2.5vw;display:flex;flex-direction:column;gap:2vh}
#list h2{font-size:5vh;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.lgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vh 1.2vw;align-content:start}
.lgrid button{background:#15151b;border:2px solid #2a2a33;border-left:1vh solid var(--acc);border-radius:1.8vh;padding:1.2vh 1.2vw;text-align:left;font-size:3.4vh;font-weight:800;line-height:1.1}
.lgrid button small{display:block;font-size:2.6vh;font-weight:700;color:#aeaeb8;margin-top:.4vh}
.lgrid button.cur{background:color-mix(in srgb,var(--acc) 22%,#15151b)}
#fin{position:absolute;inset:0;z-index:35;background:rgba(5,5,8,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
#fin .ft{font-size:14vh;font-weight:900;color:var(--acc)}
#fin button{font-size:4.6vh;font-weight:900;background:var(--acc);color:#0b0b0e;padding:2vh 4vw;border-radius:3vh}

5.0, "tag": "ДЕЛАЙ", "text": "Круги плечами назад, медленно", "step": 1}, {"t": 54.8, "tag": "ГОВОРИ", "text": "Плечи вниз, шея длинная", "step": 1}, {"t": 64.5, "tag": "ДЕЛАЙ", "text": "Теперь круги плечами вперёд", "step": 1}, {"t": 74.2, "tag": "ГОВОРИ", "text": "Дыши глубоко, расслабляй руки", "step": 1}, {"t": 84, "tag": "ГОТОВИМСЯ", "text": "Далее: Тяга вверх", "step": 1}, {"t": 90.0, "tag": "ДЕЛАЙ", "text": "Тянемся руками вверх, пальцы в замок", "step": 2}, {"t": 99.8, "tag": "ТЕХНИКА", "text": "Тянись макушкой, рёбра не выпячиваем", "step": 2}, {"t": 109.5, "tag": "ГОВОРИ", "text": "Вдох — тянись, выдох — расслабь плечи", "step": 2}, {"t": 119.2, "tag": "ГОВОРИ", "text": "Держим, дышим, без боли", "step": 2}, {"t": 129, "tag": "ГОТОВИМСЯ", "text": "Далее: Боковые наклоны", "step": 2}, {"t": 135.0, "tag": "ДЕЛАЙ", "text": "Наклон вправо, левая рука над головой", "step": 3}, {"t": 144.8, "tag": "ТЕХНИКА", "text": "Таз на месте, грудь открыта", "step": 3}, {"t": 154.5, "tag": "ДЕЛАЙ", "text": "Смена: наклон влево", "step": 3}, {"t": 164.2, "tag": "ГОВОРИ", "text": "Не пружиним, на выдохе глубже", "step": 3}, {"t": 174, "tag": "ГОТОВИМСЯ", "text": "Далее: Квадрицепс", "step": 3}, {"t": 180.0, "tag": "ДЕЛАЙ", "text": "Правая пятка к ягодице, держись за опору", "step": 4}, {"t": 189.0, "tag": "ТЕХНИКА", "text": "Колени рядом, таз чуть вперёд", "step": 4}, {"t": 198.0, "tag": "ГОВОРИ", "text": "Дыши ровно, держим 30 секунд", "step": 4}, {"t": 207.0, "tag": "ДЕЛАЙ", "text": "Смена ноги: левая пятка к ягодице", "step": 4}, {"t": 216.0, "tag": "ТЕХНИКА", "text": "Корпус прямой, колени вместе", "step": 4}, {"t": 225.0, "tag": "ГОВОРИ", "text": "На выдохе чуть глубже", "step": 4}, {"t": 234, "tag": "ГОТОВИМСЯ", "text": "Далее: Наклон к ноге", "step": 4}, {"t": 240.0, "tag": "ДЕЛАЙ", "text": "Правая нога вперёд на пятку, наклон со спиной прямой", "step": 5}, {"t": 249.0, "tag": "ТЕХНИКА", "text": "Тянись грудью к колену, не горбись", "step": 5}, {"t": 258.0, "tag": "ГОВОРИ", "text": "Дыши, на выдохе чуть глубже", "step": 5}, {"t": 267.0, "tag": "ДЕЛАЙ", "text": "Смена: левая нога вперёд", "step": 5}, {"t": 276.0, "tag": "ТЕХНИКА", "text": "Носок на себя", "step": 5}, {"t": 285.0, "tag": "ГОВОРИ", "text": "Не пружиним, без боли", "step": 5}, {"t": 294, "tag": "ГОТОВИМСЯ", "text": "Далее: Икры", "step": 5}, {"t": 300.0, "tag": "ДЕЛАЙ", "text": "Шаг вперёд, задняя пятка в пол", "step": 6}, {"t": 309.0, "tag": "ТЕХНИКА", "text": "Задняя нога прямая, пятка прижата", "step": 6}, {"t": 318.0, "tag": "ГОВОРИ", "text": "Дыши ровно, держим 30 секунд", "step": 6}, {"t": 327.0, "tag": "ДЕЛАЙ", "text": "Смена ноги", "step": 6}, {"t": 336.0, "tag": "ТЕХНИКА", "text": "Корпус наклоняем вперёд, руки на опору", "step": 6}, {"t": 345.0, "tag": "ГОВОРИ", "text": "На выдохе чуть глубже", "step": 6}, {"t": 354, "tag": "ГОТОВИМСЯ", "text": "Далее: Низкий выпад", "step": 6}, {"t": 360.0, "tag": "ДЕЛАЙ", "text": "Низкий выпад: правая нога впереди, задняя колено на пол", "step": 7}, {"t": 374.0, "tag": "ТЕХНИКА", "text": "Таз вниз и вперёд, корпус прямой", "step": 7}, {"t": 388.0, "tag": "ГОВОРИ", "text": "Руки вверх, дыши ровно, держим", "step": 7}, {"t": 402.0, "tag": "ДЕЛАЙ", "text": "Смена ноги: левая впереди", "step": 7}, {"t": 416.0, "tag": "ТЕХНИКА", "text": "Колено над щиколоткой, не заваливайся", "step": 7}, {"t": 430.0, "tag": "ГОВОРИ", "text": "Не пружиним, на выдохе глубже", "step": 7}, {"t": 444, "tag": "ГОТОВИМСЯ", "text": "Далее: Полушпагат · обе ноги", "step": 7}, {"t": 450.0, "tag": "ДЕЛАЙ", "text": "Полушпагат: правая нога вперёд, пятка на полу", "step": 8}, {"t": 464.0, "tag": "ТЕХНИКА", "text": "Таз назад, спина длинная", "step": 8}, {"t": 478.0, "tag": "ГОВОРИ", "text": "Тянись грудью к ноге, носок на себя", "step": 8}, {"t": 492.0, "tag": "ДЕЛАЙ", "text": "Смена: левая нога вперёд", "step": 8}, {"t": 506.0, "tag": "ТЕХНИКА", "text": "Колено задней ноги под тазом", "step": 8}, {"t": 520.0, "tag": "ГОВОРИ", "text": "Дыши ровно, без бол const LEAD=5;
const $=id=>document.getElementById(id);

const PLAY='<path d="M7 4l13 8-13 8z"/>',PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

let W=null,T=-LEAD,running=false,last=0,wl=null,cache={};
// menu
$("mgrid").innerHTML=DATA.map((w,i)=>`<button class="mcard" style="--acc:${w.acc}" data-i="${i}"><div class="ic">${w.steps[0].icon}</div><div><div class="t">${w.title}</div><div class="m">${fmt(w.total)} · ${w.steps.length} шагов</div><div class="b">${w.bpm}</div></div></button>`).join("");
document.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>openW(+b.dataset.i));
function openW(i,t,paused){
  W=DATA[i];T=(t===undefined)?-LEAD:t;running=false;cache={};
  $("menu").hidden=true;$("run").hidden=false;$("fin").hidden=true;$("list").hidden=true;
  $("run").style.setProperty("--acc",W.acc);$("wt").textContent=W.title;
  $("lgrid").innerHTML=W.steps.map((s,k)=>`<button data-k="${k}"><span>${k+1}. ${s.n}</span><small>${s.sub||""} · ${fmt(s.work+s.rest)}</small></button>`).join("");
  document.querySelectorAll("#lgrid button").forEach(b=>b.onclick=()=>{T=W.steps[+b.dataset.k].start;$("list").hidden=true;cache={};render(true)});
  render(true);
  if(paused===false)play();else setRun(false);
}
function phaseAt(t){
  if(t<0)return {kind:"lead",start:-LEAD,end:0,step:0};
  for(const p of W.phases)if(t>=p.start&&t<p.end)return p;
  return null;
}
function cueIdx(t){let k=-1;for(let i=0;i<W.cues.length;i++){if(W.cues[i].t<=t+1e-6)k=i;else break}return k}
function fitCue(){
  const el=$("cur"),box=$("curwrap");let fs=box.clientHeight*0.5;const min=window.innerHeight*0.055;
  el.style.fontSize=fs+"px";
  while(fs>min&&(el.scrollHeight>box.clientHeight-4||el.scrollWidth>box.clientWidth)){fs-=window.innerHeight*0.004;el.style.fontSize=fs+"px"}
}
function setRun(r){
  running=r;$("pause").hidden=r;$("playsvg").innerHTML=r?PAUSE:PLAY;

function play(){setRun(true)}

function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function render(force){

    const first=cache.pkey!==undefined&&!force;

    else $("count").hidden=true;

    $("tag").textContent=cur.tag;$("cur").textContent=cur.text;fitCue();anim($("cur"),"in");anim($("tag"),"in");
    const a=W.cues[ci+1],b=W.cues[ci+2];
    $("n1t").textContent=a?a.tag:"";$("n1").textContent=a?a.text:"";
    $("n2t").textContent=b?b.tag:"";$("n2").textContent=b?b.text:"";
  }
  const cs=document.querySelectorAll("#lgrid button");

function tick(){

  render(false);
}
setInterval(tick,100);
function stepOf(){const p=phaseAt(Math.max(0,Math.min(T,W.total-0.001)));return p?p.step:0}

$("pbtn").onclick=()=>play();$("pause").onclick=()=>play();

$("bBack").onclick=()=>{setRun(false);if(wl){wl.release();wl=null}$("run").hidden=true;$("menu").hidden=false;$("pause").hidden=true};
$("finBtn").onclick=()=>$("bBack").onclick();
$("bList").onclick=()=>{$("list").hidden=false};$("lClose").onclick=()=>{$("list").hidden=true};
$("bFs").onclick=()=>{const d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()};

window.addEventListener("resize",()=>{if(W&&!$("run").hidden)fitCue()});

const q=new URLSearchParams(location.search);
if(q.has("w")){openW(+q.get("w"),q.has("t")?+q.get("t"):undefined,q.get("p")==="0"?false:undefined);if(FREEZE)$("pause").hidden=true}
